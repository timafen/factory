name: Deep checks

on:
  schedule:
    - cron: "17 5 * * 0,2-6"
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-deep:
    name: Linux nightly safety checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - name: Install UI dependencies
        working-directory: web
        run: npm ci
      - name: Test operator build and installers
        run: just test-tooling
      - name: Test local startup and shutdown
        run: just test-launcher
      - name: Build and compare every release artifact twice
        run: just test-release
      - name: Check reachable Go vulnerabilities
        run: just vuln
      - name: Run deep static analysis
        run: just staticcheck
      - name: Run worker race detector
        run: just test-worker-race
      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Run all browser scenarios
        run: just test-browser
      - name: Upload full browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: full-browser-evidence
          path: |
            web/test-results/
            web/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  macos:
    name: Weekly macOS (${{ matrix.arch }})
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 5 * * 1'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: amd64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - name: Confirm native Darwin architecture
        run: test "$(go env GOOS)/$(go env GOARCH)" = "darwin/${{ matrix.arch }}"
      - name: Run Go tests
        run: go test -timeout 5m ./...
      - name: Run worker race detector
        run: just test-worker-race
      - name: Build and inspect native binaries
        env:
          FACTORY_BUILD_DIR: ${{ runner.temp }}/factory-bin
        run: |
          just build
          test -x "$FACTORY_BUILD_DIR/factory-server"
          test -x "$FACTORY_BUILD_DIR/factory-worker"
          go version -m "$FACTORY_BUILD_DIR/factory-server" | grep -F "GOARCH=${{ matrix.arch }}"
          go version -m "$FACTORY_BUILD_DIR/factory-worker" | grep -F "GOARCH=${{ matrix.arch }}"
