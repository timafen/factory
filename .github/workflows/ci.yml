name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux build and Go tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - name: Build Linux binaries
        run: just build
      - name: Check Go formatting
        run: just format-check
      - name: Run Go vet
        run: just vet
      - name: Check worker-control-plane boundary
        run: just boundary
      - name: Run core Go tests
        run: just test

  ui:
    name: UI tests and embedded build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - name: Install UI dependencies
        working-directory: web
        run: npm ci
      - name: Run UI lint, type checks, and component tests
        run: just ui-check
      - name: Build embedded UI
        run: just ui-build 0
      - name: Check embedded UI is current
        run: |
          git diff --exit-code -- web/dist
          test -z "$(git status --porcelain --untracked-files=all -- web/dist)"

  browser_critical:
    name: Critical browser paths
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - name: Install UI dependencies
        working-directory: web
        run: npm ci
      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Run five release-blocking browser scenarios
        run: just test-browser-critical
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: critical-browser-evidence
          path: |
            web/test-results/
            web/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  pilot:
    name: Pilot tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run Pilot tests
        run: python3 -m unittest pilot.test_pilot

  check:
    name: check
    if: always()
    needs: [linux, ui, browser_critical, pilot]
    runs-on: ubuntu-24.04
    steps:
      - name: Require the Linux server checks
        env:
          LINUX_RESULT: ${{ needs.linux.result }}
          UI_RESULT: ${{ needs.ui.result }}
          BROWSER_RESULT: ${{ needs.browser_critical.result }}
          PILOT_RESULT: ${{ needs.pilot.result }}
        run: |
          test "$LINUX_RESULT" = success
          test "$UI_RESULT" = success
          test "$BROWSER_RESULT" = success
          test "$PILOT_RESULT" = success
